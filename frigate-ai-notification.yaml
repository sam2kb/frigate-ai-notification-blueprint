blueprint:
  name: Frigate AI Notification
  author: sam2kb
  description: >
    [1.0.0] Multi-camera notifications powered by Frigate and optional LLMVision summaries.
    Filter by detection quality, zones and recognized faces, with optional silence and cooldown controls.
  source_url: https://github.com/sam2kb/frigate-ai-notification-blueprint/blob/main/frigate-ai-notification.yaml
  domain: automation
  homeassistant:
    min_version: 2026.3.0

  input:
    mqtt_topic:
      name: Frigate MQTT event topic
      description: Match the topic_prefix configured in Frigate, followed by /events.
      default: frigate/events
      selector: { text: {} }

    camera:
      name: Frigate Cameras
      description: Select one or more Frigate cameras to monitor for events.
      selector:
        entity:
          domain: [camera]
          multiple: true

    labels:
      name: Labels to Notify On
      description: List of Frigate object labels to notify on. Leave empty to match all.
      default: [person]
      selector:
        select:
          multiple: true
          options: [person, dog, cat, car, package, bicycle, face]
          sort: false
          custom_value: true

    zones:
      name: Include Zones
      description: >
        Comma-separated list of Frigate zone names. Example: driveway, porch.
        Matches full zone IDs, with wildcards (* and ?), e.g. *_near. Use *porch* for substring matching.
        Leave empty to match all zones.
      default: ""
      selector:
        text: {}

    zones_exclude:
      name: Exclude Zones
      description: >
        Zones that always suppress notifications. If an event matches both include and exclude, it is BLOCKED.
        Matches full zone IDs; use *porch* to exclude every zone containing porch.
      default: ""
      selector:
        text: {}

    zone_match_type:
      name: Zone Match Type
      description: Which zone field to check from Frigate.
      default: either
      selector:
        select:
          mode: dropdown
          options:
            - entered # only after.entered_zones (crossings)
            - current # only after.current_zones (currently inside)
            - either # union of entered+current

    zone_logic:
      name: Zone Logic for include list
      description: "any: intersects at least one listed include zone; all: must be in all listed include zones"
      default: any
      selector:
        select:
          mode: dropdown
          options: [any, all]

    cooldown:
      name: Global Cooldown
      description: The cooldown is a global throttle for push notifications and LLM step from firing too often. Turning this on will lead to missed/skipped notifications.
      default: { hours: 0, minutes: 0, seconds: 0 }
      selector:
        duration:
          enable_day: true

    cooldown_timestamp:
      name: Global Cooldown Helper (optional)
      description: Datetime helper used the global cooldown above. Open the picker → select "Create" → name it "Frigate Notification Cooldown" → select "Date and Time" → Create.
      default: ""
      selector:
        entity:
          domain: [input_datetime]
          multiple: false

    notify_device:
      name: Mobile Devices
      description: Select devices (Home Assistant Companion app) to receive the notification.
      selector:
        device:
          integration: mobile_app
          multiple: true

    notification_customization:
      name: Notification Customization
      icon: mdi:message-alert
      description: Configure optional notification features
      collapsed: true
      input:
        ios_live_view:
          name: iOS Notification
          description: Enable HLS playback and extra actions for Apple devices. Android recipients keep MP4 links and at most three actions.
          default: false
          selector: { boolean: {} }
        append:
          name: Append "Camera"
          description: Add the word "Camera" to the end of the camera name (e.g., "Back Yard" → "Back Yard Camera").
          default: false
          selector: { boolean: {} }
        expand:
          name: Expand "Cam" → "Camera"
          description: Replace "Cam" with "Camera" in the camera name.
          default: false
          selector: { boolean: {} }

    quality_filters:
      name: Signal Quality Filters
      icon: mdi:tune-variant
      description: Reduce noise by filtering low-confidence or incomplete events
      collapsed: true
      input:
        min_score:
          name: Minimum Detection Score
          default: 0.6
          selector:
            number: { min: 0, max: 1, step: 0.05, mode: slider }

        require_clip:
          name: Require Event Recording
          description: Require has_clip=true (recording retention is enabled for the event). This flag does not guarantee the clip is ready to download yet.
          default: false
          selector: { boolean: {} }

        require_not_false_positive:
          name: Ignore Likely False Positives
          default: true
          selector: { boolean: {} }

        suppress_known_faces:
          name: Suppress Known Faces
          description: >-
            Comma-separated list of recognized face names to suppress. Names with spaces are fine
            (e.g. "John Doe"). Matches case-insensitively against Frigate's sub_label. Leave empty
            to notify on all faces. Example: Alice, John Doe, Mary Jane
          default: ""
          selector:
            text:
              multiline: false

    llmvision_tweaks:
      name: LLMVision Tweaks
      icon: mdi:brain
      description: Tweak LLMVision settings and options
      collapsed: true
      input:
        helper:
          name: Input Helper
          description: >
            Optional shared busy flag for LLM analysis. Analysis errors release the flag before retrying.
            Open the picker → select "Create" → name it "Frigate LLM Busy" → Create.
          default: ""
          selector:
            entity:
              domain: [input_boolean]
              multiple: false
        log_helper:
          name: AI Description Log Helper
          description: >
            Optional Input Text helper to persist AI-generated descriptions beyond the notification.
            Create an Input Text helper (e.g. "Frigate AI Log"), set its maximum length to 255, and select it here.
            Stores the latest descriptions, newest first, up to the helper maximum length (255 characters at most).
            Longer history is available in LLMVision's timeline; this helper is a short dashboard preview.
          default: ""
          selector:
            entity:
              domain: [input_text]
              multiple: false
        dashboard:
          name: Event Summary Dashboard
          description: Optional dashboard URL opened by the "View Summary" action; leave blank to hide the button.
          default: ""
          selector: { text: {} }
        generate_title:
          name: Generate Event Title
          description: Enable to generate a dynamic title for each event summary.
          default: true
          selector: { boolean: {} }
        include_filename:
          name: Include Filenames
          description: Attach filenames when sending Frigate clips.
          default: false
          selector: { boolean: {} }
        expose_images:
          name: Expose Images
          description: Save analyzed frames using LLMVision's configured image storage. File paths are included in its response.
          default: true
          selector: { boolean: {} }
        provider:
          name: Provider
          description: Choose the LLMVision provider. See documentation for supported options.
          default: ""
          selector:
            config_entry:
              integration: llmvision
        model:
          name: Model
          description: Language model to use. Leave blank to use the selected provider's configured default.
          default: ""
          selector:
            text:
              multiline: false
              multiple: false
        prompt:
          name: LLMVision Prompt
          default: >
            Summarize the observed events using clear, neutral third-person language. Use timestamps to ensure the summary
            follows the correct chronological order. Focus on moving subjects such as people, vehicles, animals, packages,
            equipment, or other active elements. Ignore static background objects unless directly interacted with. Include
            stationary vehicles only if they are clearly identifiable as delivery or emergency vehicles, mentioning any visible
            company names or uniform details. Describe activity relevant to the general monitored area without referencing
            camera angles, timestamps, or observers. Present the events as if witnessed in real time, avoiding frame-by-frame
            descriptions or introductory phrases. Summarize naturally in a single, cohesive narrative, keeping it concise and
            suitable for brief notifications. When context strongly suggests a likely outcome, describe it confidently. Do not
            mention the absence of activity or objects, nor conclude with statements about what was or wasn’t observed.
          selector:
            text:
              multiline: true
              multiple: false
        max_tokens:
          name: Maximum Tokens
          description: Limit the number of tokens used in the summary (controls length). Increase for modern models (e.g. 200+ for GPT-5).
          default: 100
          selector:
            number: { min: 1, max: 4000, step: 10, mode: slider }
        temperature:
          name: Temperature (deprecated)
          description: Retained for saved automations. This input is ignored; set temperature in the LLMVision provider configuration.
          default: 0.1
          selector:
            number: { min: 0.1, max: 1.0, step: 0.1, mode: slider }
        max_frames:
          name: Total Frames
          description: Number of frames to analyze from the event.
          default: 3
          selector:
            number: { min: 1, max: 60, step: 1, mode: slider }
        frigate_retry_attempts:
          name: Retry Attempts
          description: Maximum analysis attempts if the clip or provider is temporarily unavailable.
          default: 4
          selector:
            number: { min: 1, max: 20, step: 1, mode: slider }
        frigate_retry_time:
          name: Retry Timing
          description: Delay between failed analysis attempts.
          default: { hours: 0, minutes: 0, seconds: 30 }
          selector: { duration: {} }
        target_width:
          name: Target Width
          description: Downscale frame width to reduce token usage and speed up processing.
          default: 1920
          selector:
            number: { min: 480, max: 3840, step: 20, mode: slider }

    advanced_options:
      name: Advanced Options
      icon: mdi:cog
      description: Customize Frigate, Home Assistant, and other details
      collapsed: true
      input:
        sublabel:
          name: Sublabels
          description: Include Frigate sublabels in the prompt if available.
          default: true
          selector: { boolean: {} }
        base_url:
          name: External Base URL
          description: Public URL for Home Assistant. Leave empty to let the Companion app resolve relative links to this Home Assistant server.
          default: ""
          selector: { text: {} }
        local_url:
          name: Internal Base URL
          description: Local URL for Home Assistant. Used when External Base URL is empty; leave both empty for Companion app relative links.
          default: ""
          selector: { text: {} }
        frigate_url:
          name: Frigate Instance URL
          description: Optional. Full base URL to your Frigate UI (include port if needed), e.g. https://frigate.lan:8971
          default: ""
          selector: { text: {} }
        require_zones:
          name: Require Zone Data
          description: >
            Wait for zone data before sending notifications or AI analysis.
            A later update can notify once its selected zone list is populated.
          default: false
          selector: { boolean: {} }
        camera_name_map:
          name: Camera Name Override Map (optional)
          description: >
            Optional JSON map to override Frigate camera names for selected camera entities.
            Use when your HA camera entity ids do not match Frigate's camera names.
            Example: {"camera.front_door_2":"front_door"}
          default: ""
          selector:
            text:
              multiline: true
        # Manual per-camera silence; automatic throttling uses the cooldown input.
        silence_table:
          name: Per-Camera Silence Table (input_text)
          description: >
            Recommended. Input Text helper storing a JSON map of {camera_slug: silent_until_ts}.
            Create an Input Text (e.g. "Frigate Silence Table"), set its maximum length to 255 and value to "{}", and select it here.
            If not set, the Silence button mutes the whole automation temporarily. Existing active mutes must fit in the helper.
          default: ""
          selector:
            entity:
              domain: [input_text]
              multiple: false
        debug:
          name: Debugging
          description: Enable debug logging for this automation.
          default: false
          selector: { boolean: {} }
        notification_timeout:
          name: Notification Timeout (hours)
          description: Time before Android automatically clears the notification.
          default: 10
          selector:
            number:
              { min: 1, max: 48, step: 1, unit_of_measurement: hours, mode: slider }

trigger:
  - trigger: mqtt
    id: frigate-event
    topic: !input mqtt_topic
  - trigger: event
    event_type: mobile_app_notification_action
    id: mobile-action

condition: []

action:
  - variables:
      selected_cameras: !input camera
      input_camera_name_map: !input camera_name_map
      input_labels: !input labels
      input_zones: !input zones
      input_zones_exclude: !input zones_exclude
      input_zone_match_type: !input zone_match_type
      input_zone_logic: !input zone_logic
      input_require_zones: !input require_zones
      min_score: !input min_score
      require_clip: !input require_clip
      require_not_false_positive: !input require_not_false_positive
      input_suppress_faces: !input suppress_known_faces
      raw_device: !input notify_device
      input_append: !input append
      input_expand: !input expand
      input_ios_live_view: !input ios_live_view
      input_dashboard: !input dashboard
      input_base_url: !input base_url
      input_local_url: !input local_url
      input_frigate_url: !input frigate_url
      input_notification_timeout: !input notification_timeout
      input_cooldown: !input cooldown
      input_cooldown_datetime: !input cooldown_timestamp
      input_silence_table: !input silence_table
      input_provider: !input provider
      input_model: !input model
      input_prompt: !input prompt
      input_sublabel: !input sublabel
      input_helper: !input helper
      input_log_helper: !input log_helper
      input_frigate_retry_attempts: !input frigate_retry_attempts
      input_frigate_retry_time: !input frigate_retry_time
      input_max_frames: !input max_frames
      input_target_width: !input target_width
      input_max_tokens: !input max_tokens
      input_include_filename: !input include_filename
      input_generate_title: !input generate_title
      input_expose_images: !input expose_images
      input_debug: !input debug
      raw_payload: "{{ trigger.payload_json | default({}, true) }}"
      payload: "{{ raw_payload if raw_payload is mapping else {} }}"
      event_type: "{{ payload.get('type', '') }}"
      after_raw: "{{ payload.get('after') or {} }}"
      before_raw: "{{ payload.get('before') or {} }}"
      event_after: "{{ after_raw if after_raw is mapping else {} }}"
      event_before: "{{ before_raw if before_raw is mapping else {} }}"
      id: "{{ event_after.get('id') or event_before.get('id') or '' }}"
      camera: "{{ event_after.get('camera') or event_before.get('camera') or '' }}"
      camera_key: "{{ camera | lower | replace('-', '_') }}"
      camera_map: {}
      silence_table: {}
  - variables:
      camera_map: "{{ input_camera_name_map | from_json({}) }}"
  - variables:
      camera_map: "{{ camera_map if camera_map is mapping else {} }}"
      camera_entity: >-
        {% set ns = namespace(entity='') %}
        {% for ent in selected_cameras %}
          {% set slug = ent | replace('camera.', '') | lower | replace('-', '_') %}
          {% set mapped = camera_map.get(ent, camera_map.get(slug, slug)) | string | lower | replace(' ', '_') | replace('-', '_') %}
          {% if mapped == camera_key and not ns.entity %}{% set ns.entity = ent %}{% endif %}
        {% endfor %}
        {{ ns.entity }}
      silence_table_enabled: "{{ input_silence_table | default('', true) | length > 0 }}"
      cooldown_secs: >-
        {{ (input_cooldown.get('days', 0) | int(0)) * 86400
           + (input_cooldown.get('hours', 0) | int(0)) * 3600
           + (input_cooldown.get('minutes', 0) | int(0)) * 60
           + (input_cooldown.get('seconds', 0) | int(0)) }}
      retry_secs: >-
        {{ (input_frigate_retry_time.get('days', 0) | int(0)) * 86400
           + (input_frigate_retry_time.get('hours', 0) | int(0)) * 3600
           + (input_frigate_retry_time.get('minutes', 0) | int(0)) * 60
           + (input_frigate_retry_time.get('seconds', 0) | int(0)) }}
      last_send_ts: 0
      last_send_context: ""

  # Invalid JSON and non-object values behave like an empty helper.
  - &read_silence
    variables:
      silence_raw: "{{ (states(input_silence_table) if silence_table_enabled else '{}') | from_json({}) }}"
      silence_table: "{{ silence_raw if silence_raw is mapping else {} }}"

  # Handle mobile actions before requiring an MQTT payload.
  - choose:
      - conditions: "{{ trigger.id == 'mobile-action' }}"
        sequence:
          - condition: template
            value_template: >-
              {{ (trigger.event.data.action | default('')) is string
                 and trigger.event.data.action.startswith('SILENCE_' ~ this.entity_id ~ '__') }}
          - variables:
              action_cam: "{{ trigger.event.data.action.split('__', 1)[1] }}"
              reply: "{{ trigger.event.data.reply_text | default('') | string | trim }}"
              silence_min: >-
                {{ [120, [1, reply | int(5)] | max] | min if reply is match('^\\d+$') else 5 }}
          - choose:
              - conditions: "{{ silence_table_enabled and action_cam | length > 0 }}"
                sequence:
                  - variables:
                      silence_json: >-
                        {% set current = silence_table %}
                        {% set ts = as_timestamp(now()) | int %}
                        {% set ns = namespace(keep={}) %}
                        {% for key, value in current.items() %}
                          {% if value | int(0) > ts %}{% set ns.keep = dict(ns.keep, **{key: value | int}) %}{% endif %}
                        {% endfor %}
                        {{ dict(ns.keep, **{action_cam: ts + (silence_min | int) * 60}) | to_json }}
                  - choose:
                      - conditions: "{{ silence_json | string | length <= state_attr(input_silence_table, 'max') | int(100) }}"
                        sequence:
                          - service: input_text.set_value
                            target:
                              entity_id: "{{ input_silence_table }}"
                            data:
                              value: "{{ silence_json }}"
                          - service: persistent_notification.create
                            data:
                              title: Frigate Notifications
                              message: "Silenced {{ action_cam }} for {{ silence_min }} minutes."
                    default:
                      - service: persistent_notification.create
                        data:
                          title: Frigate silence failed
                          message: >-
                            The silence table is full. Increase {{ input_silence_table }}'s
                            maximum length (up to 255) or wait for an existing mute to expire.
              - conditions: "{{ not silence_table_enabled }}"
                sequence:
                  - service: automation.turn_off
                    target:
                      entity_id: "{{ this.entity_id }}"
                    data:
                      stop_actions: false
                  - delay:
                      minutes: "{{ silence_min }}"
                  - service: automation.turn_on
                    target:
                      entity_id: "{{ this.entity_id }}"
          - stop: Handled mobile action

  - variables:
      gate_rejections: >-
        {% set ns = namespace(reasons=[]) %}
        {% if raw_payload is not mapping or event_after | length == 0 %}{% set ns.reasons = ns.reasons + ['invalid_payload'] %}{% endif %}
        {% if event_type not in ['new', 'update', 'end'] %}{% set ns.reasons = ns.reasons + ['unsupported_event_type'] %}{% endif %}
        {% if not camera_entity %}{% set ns.reasons = ns.reasons + ['camera_unmatched'] %}{% endif %}
        {% if id | string | length == 0 %}{% set ns.reasons = ns.reasons + ['missing_event_id'] %}{% endif %}
        {% if input_labels | length > 0 and (event_after.get('label', '') | lower) not in (input_labels | map('lower') | list) %}{% set ns.reasons = ns.reasons + ['label_unselected'] %}{% endif %}
        {{ ns.reasons }}
  - choose:
      - conditions: "{{ input_debug and trigger.id == 'frigate-event' and gate_rejections | length > 0 }}"
        sequence:
          - service: logbook.log
            data:
              name: Frigate Notification
              message: "Rejected MQTT event: reasons={{ gate_rejections | join(', ') }} type={{ event_type }} camera={{ camera }} selected_cameras={{ selected_cameras }} label={{ event_after.get('label', '') }} selected_labels={{ input_labels }}. Check Camera Name Override Map for camera_unmatched."
  - condition: template
    value_template: "{{ trigger.id == 'frigate-event' and gate_rejections | length == 0 }}"

  - variables:
      zones_include_rx: >-
        {% set ns = namespace(rx=[]) %}
        {% for p in input_zones.split(',') | map('trim') | map('lower') | reject('eq', '') %}
          {% set escaped = namespace(body='') %}
          {% for char in p %}
            {% set escaped.body = escaped.body ~ ('.*' if char == '*' else '.' if char == '?' else '\\' ~ char if char in '.^$+{}()|[]\\' else char) %}
          {% endfor %}
          {% set ns.rx = ns.rx + ['^' ~ escaped.body ~ '$'] %}
        {% endfor %}
        {{ ns.rx }}
      zones_exclude_rx: >-
        {% set ns = namespace(rx=[]) %}
        {% for p in input_zones_exclude.split(',') | map('trim') | map('lower') | reject('eq', '') %}
          {% set escaped = namespace(body='') %}
          {% for char in p %}
            {% set escaped.body = escaped.body ~ ('.*' if char == '*' else '.' if char == '?' else '\\' ~ char if char in '.^$+{}()|[]\\' else char) %}
          {% endfor %}
          {% set ns.rx = ns.rx + ['^' ~ escaped.body ~ '$'] %}
        {% endfor %}
        {{ ns.rx }}
      suppressed_names: "{{ input_suppress_faces.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
      # Evaluate the same rules against both snapshots. END uses its own after data.
      event_checks: >-
        {% set out = namespace(checks=[]) %}
        {% for a in [event_before, event_after] %}
          {% set entered = (a.get('entered_zones') or []) | map('lower') | list %}
          {% set current = (a.get('current_zones') or []) | map('lower') | list %}
          {% set Z = entered if input_zone_match_type == 'entered' else current if input_zone_match_type == 'current' else (entered + current) | unique | list %}
          {% set ns = namespace(excluded=false, included=(zones_include_rx | length == 0 or input_zone_logic == 'all')) %}
          {% for rx in zones_exclude_rx %}
            {% for z in Z %}{% if z is match(rx, ignorecase=true) %}{% set ns.excluded = true %}{% endif %}{% endfor %}
          {% endfor %}
          {% for rx in zones_include_rx %}
            {% set found = namespace(hit=false) %}
            {% for z in Z %}{% if z is match(rx, ignorecase=true) %}{% set found.hit = true %}{% endif %}{% endfor %}
            {% if input_zone_logic == 'all' and not found.hit %}{% set ns.included = false %}{% endif %}
            {% if input_zone_logic != 'all' and found.hit %}{% set ns.included = true %}{% endif %}
          {% endfor %}
          {% set sl = a.get('sub_label') %}
          {% set name = sl if sl is string else sl[0] if sl is sequence and sl | length > 0 else '' %}
          {% set name = name | default('', true) | string | trim %}
          {% set score = (a.get('top_score') if a.get('top_score') is not none else a.get('score', 0)) | float(0) %}
          {% set quality_ok = score >= (min_score | float) and (not require_clip or a.get('has_clip', false)) and (not require_not_false_positive or a.get('false_positive') in [false, none]) %}
          {% set zone_ok = ns.included and not ns.excluded and (not input_require_zones or Z | length > 0) %}
          {% set face_ok = name | lower not in suppressed_names %}
          {% set zone_reason = 'excluded' if ns.excluded else 'include_unmatched' if not ns.included else 'zone_data_required' if input_require_zones and Z | length == 0 else 'allowed' %}
          {% set out.checks = out.checks + [dict(allowed=(quality_ok and zone_ok and face_ok), quality_ok=quality_ok, zone_ok=zone_ok, zone_reason=zone_reason, face_ok=face_ok, zones=Z, name=name, score=score)] %}
        {% endfor %}
        {{ out.checks }}
      before_checks: "{{ event_checks[0] }}"
      checks: "{{ event_checks[1] }}"
      snapshot_before: "{{ event_before.get('snapshot') or {} }}"
      snapshot_after: "{{ event_after.get('snapshot') or {} }}"
      snapshot_changed: >-
        {{ (event_after.get('snapshot_time') or snapshot_after.get('frame_time')) is not none
           and (event_after.get('snapshot_time') or snapshot_after.get('frame_time')) != (event_before.get('snapshot_time') or snapshot_before.get('frame_time')) }}
      meaningful_update: >-
        {{ (not before_checks.allowed and checks.allowed)
           or (event_after.get('has_clip', false) and not event_before.get('has_clip', false))
           or checks.name != before_checks.name or checks.zones | sort != before_checks.zones | sort
           or (snapshot_changed and not event_after.get('stationary', event_after.get('motionless', false))) }}
      camera_name: >-
        {% set n = camera | replace('_', ' ') | replace('-', ' ') | title %}
        {% if input_expand %}{% set n = n | regex_replace('(?i)\\bcam\\b', 'Camera') %}{% endif %}
        {{ n ~ (' Camera' if input_append else '') }}
      label: "{{ event_after.get('label', '') | title }}"
      sub_label_text: "{{ checks.name }}"
      base_title: "{{ label }} detected"
      base_message: "{{ label }} detected by {{ camera_name }}."
      icon: >-
        {{ {'person': 'mdi:account-outline', 'dog': 'mdi:dog', 'cat': 'mdi:cat', 'car': 'mdi:car'}.get(event_after.get('label'), 'mdi:home-assistant') }}
      # Relative paths are resolved by the Companion app against the sending HA server.
      effective_base_url: "{{ ((input_base_url | trim) or (input_local_url | trim)) | regex_replace('/+$', '') }}"
      clip_url: "{{ effective_base_url }}/api/frigate/notifications/{{ id }}/{{ camera }}/clip.mp4"
      snapshot_url: "{{ effective_base_url }}/api/frigate/notifications/{{ id }}/snapshot.jpg"
      thumbnail_url: "{{ effective_base_url }}/api/frigate/notifications/{{ id }}/thumbnail.jpg"
      video_ios: "{{ effective_base_url }}/api/frigate/notifications/{{ id }}/{{ camera }}/master.m3u8"
      live_deeplink: "/?more-info-entity-id={{ camera_entity }}"
      frigate_review_url: "{{ input_frigate_url | trim | regex_replace('/+$', '') }}"
      notification_title: "{{ (sub_label_text ~ ' detected') if sub_label_text else base_title }}"
      notification_message: "{{ base_message ~ (' (' ~ sub_label_text ~ ')' if sub_label_text else '') }}"
      notification_tag: "{{ id if event_type == 'end' else camera_key }}"
      timeout_secs: "{{ (input_notification_timeout | float * 3600) | int }}"

  - choose:
      - conditions: "{{ input_debug }}"
        sequence:
          - service: logbook.log
            data:
              name: Frigate Notification
              message: "{{ event_type }}: camera={{ camera }} id={{ id }} eligible={{ checks.allowed }} quality={{ checks.quality_ok }} zones={{ checks.zone_ok }} zone_reason={{ checks.zone_reason }} observed_zones={{ checks.zones }} include={{ input_zones }} exclude={{ input_zones_exclude }} face={{ checks.face_ok }}. Zone patterns match full IDs; use *porch* for substring matching."

  - variables:
      not_silenced: &not_silenced >-
        {{ is_state(this.entity_id, 'on') and (as_timestamp(now()) | int) >= (silence_table.get(camera_key, 0) | int(0)) }}
      cooldown_available: &cooldown_available >-
        {% set last = state_attr(input_cooldown_datetime, 'timestamp') | float(0) if input_cooldown_datetime else 0 %}
        {{ not input_cooldown_datetime or cooldown_secs | int <= 0
           or (last_send_ts | float > 0 and last == last_send_ts | float and states[input_cooldown_datetime].context.id == last_send_context)
           or as_timestamp(now()) - last >= cooldown_secs | int }}
      normal_send_allowed: "{{ checks.allowed and (event_type in ['new', 'end'] or meaningful_update) and not_silenced and cooldown_available }}"
  - choose:
      - conditions: "{{ normal_send_allowed }}"
        sequence:
          - repeat: &send_notification
              for_each: "{{ raw_device }}"
              sequence:
                - variables:
                    notify_name: "{{ device_attr(repeat.item, 'name') | default('', true) }}"
                    notify_service: "{{ 'notify.mobile_app_' ~ (notify_name | slugify) }}"
                    notify_ready: >-
                      {% set ns = namespace(loaded=false) %}
                      {% set primary = device_attr(repeat.item, 'config_entry_id') %}
                      {% set entries = [primary] if primary else device_attr(repeat.item, 'config_entries') or [] %}
                      {% for entry in entries %}
                        {% set state = config_entry_attr(entry, 'state') %}
                        {% if config_entry_attr(entry, 'domain') == 'mobile_app' and state.value | default(state) == 'loaded' %}{% set ns.loaded = true %}{% endif %}
                      {% endfor %}
                      {{ notify_name | length > 0 and ns.loaded }}
                    device_ios: "{{ input_ios_live_view and (device_attr(repeat.item, 'manufacturer') | default('', true) | lower).startswith('apple') }}"
                    view_media_url: "{{ (video_ios if device_ios else clip_url) if event_after.get('has_clip', false) else snapshot_url if event_after.get('has_snapshot', false) else live_deeplink }}"
                    notification_actions: >-
                      {% set media_title = 'View Clip' if event_after.get('has_clip', false) else 'View Snapshot' if event_after.get('has_snapshot', false) else 'View Live' %}
                      {% set ns = namespace(actions=[dict(action='URI', title=media_title, uri=view_media_url)]) %}
                      {% if input_dashboard | trim %}
                        {% set ns.actions = ns.actions + [dict(action='URI', title='View Summary', uri=input_dashboard | trim)] %}
                      {% elif view_media_url != live_deeplink %}
                        {% set ns.actions = ns.actions + [dict(action='URI', title='View Live', uri=live_deeplink)] %}
                      {% endif %}
                      {% set ns.actions = ns.actions + [dict(action='SILENCE_' ~ this.entity_id ~ '__' ~ camera_key, title='Silence', behavior='textInput')] %}
                      {% if device_ios %}
                        {% if input_dashboard | trim and view_media_url != live_deeplink %}{% set ns.actions = ns.actions + [dict(action='URI', title='View Live', uri=live_deeplink)] %}{% endif %}
                        {% if frigate_review_url %}{% set ns.actions = ns.actions + [dict(action='URI', title='Open Frigate', uri=frigate_review_url)] %}{% endif %}
                      {% endif %}
                      {{ ns.actions }}
                - if: "{{ notify_ready }}"
                  then:
                    - service: "{{ notify_service }}"
                      continue_on_error: true
                      data:
                        title: "{{ notification_title }}"
                        message: "{{ notification_message }}"
                        data:
                          channel: "{{ camera_name }} Notifications"
                          timeout: "{{ timeout_secs }}"
                          tag: "{{ notification_tag }}"
                          group: "{{ camera_name }}"
                          ttl: 0
                          priority: high
                          notification_icon: "{{ icon }}"
                          attachment:
                            url: "{{ thumbnail_url ~ '?t=' ~ (as_timestamp(now()) | int) }}"
                          image: "{{ thumbnail_url ~ '?format=android&t=' ~ (as_timestamp(now()) | int) }}"
                          clickAction: "{{ view_media_url }}"
                          url: "{{ view_media_url }}"
                          push:
                            interruption-level: active
                          alert_once: true
                          actions: "{{ notification_actions }}"
                  else:
                    - service: logbook.log
                      data:
                        name: Frigate Notification
                        message: "Skipped notification device {{ repeat.item }}: its mobile app entry is missing or unloaded."
          - if: "{{ input_cooldown_datetime | length > 0 }}"
            then:
              - service: input_datetime.set_datetime
                target:
                  entity_id: "{{ input_cooldown_datetime }}"
                data:
                  timestamp: "{{ as_timestamp(now()) | int }}"

  - variables:
      last_send_ts: "{{ state_attr(input_cooldown_datetime, 'timestamp') | float(0) if input_cooldown_datetime and normal_send_allowed else 0 }}"
      last_send_context: "{{ states[input_cooldown_datetime].context.id if input_cooldown_datetime and normal_send_allowed else '' }}"

  # Analyze completed events only; no run needs to wait for the next MQTT message.
  - condition: template
    value_template: "{{ event_type == 'end' and input_provider | string | trim | length > 0 and checks.allowed and event_after.get('has_clip', false) }}"
  - &check_provider
    if: >-
      {% set state = config_entry_attr(input_provider, 'state') %}
      {{ state.value | default(state) != 'loaded' }}
    then:
      - service: logbook.log
        data:
          name: Frigate Notification
          message: The selected LLMVision provider is not loaded. Check its integration configuration.
      - stop: LLMVision provider unavailable
  - delay: "00:00:30"
  - *read_silence
  - condition: template
    value_template: *not_silenced
  - condition: template
    value_template: *cooldown_available

  - if: "{{ input_helper | length > 0 }}"
    then:
      - wait_template: "{{ is_state(input_helper, 'off') }}"
        timeout: "00:03:00"
        continue_on_timeout: false

  # Recheck after waiting: a user may have silenced the camera in the meantime.
  - *read_silence
  - condition: template
    value_template: *not_silenced
  - condition: template
    value_template: *cooldown_available
  - variables:
      response: {}
  - repeat:
      sequence:
        - if: "{{ input_helper | length > 0 }}"
          then:
            - wait_template: "{{ is_state(input_helper, 'off') }}"
              timeout: "00:03:00"
              continue_on_timeout: false
        - *check_provider
        - *read_silence
        - if:
            - condition: template
              value_template: >-
                {{ not is_state(this.entity_id, 'on') or (as_timestamp(now()) | int) < (silence_table.get(camera_key, 0) | int(0)) }}
          then:
            - stop: Camera silenced while waiting for AI
        - if:
            - condition: template
              value_template: >-
                {% set last = state_attr(input_cooldown_datetime, 'timestamp') | float(0) if input_cooldown_datetime else 0 %}
                {{ input_cooldown_datetime and cooldown_secs | int > 0 and as_timestamp(now()) - last < cooldown_secs | int
                   and not (last_send_ts | float > 0 and last == last_send_ts | float and states[input_cooldown_datetime].context.id == last_send_context) }}
          then:
            - stop: Global cooldown changed while waiting for AI
        - if: "{{ input_helper | length > 0 }}"
          then:
            - service: input_boolean.turn_on
              target:
                entity_id: "{{ input_helper }}"
        - service: llmvision.video_analyzer
          alias: Analyze Frigate clip
          continue_on_error: true
          data:
            store_in_timeline: true
            model: "{{ input_model }}"
            provider: "{{ input_provider }}"
            max_frames: "{{ input_max_frames }}"
            include_filename: "{{ input_include_filename }}"
            target_width: "{{ input_target_width }}"
            max_tokens: "{{ input_max_tokens }}"
            generate_title: "{{ input_generate_title }}"
            expose_images: "{{ input_expose_images }}"
            event_id: "{{ id }}"
            message: >-
              {{ input_prompt }}
              {% if input_sublabel and sub_label_text %}Frigate identified the subject as {{ sub_label_text }}.{% endif %}
          response_variable: response
        # Release before logging or notification work, including on analyzer errors.
        - if: "{{ input_helper | length > 0 }}"
          then:
            - service: input_boolean.turn_off
              continue_on_error: true
              target:
                entity_id: "{{ input_helper }}"
        - if: "{{ not (response is mapping and response.get('response_text') is string and response.get('response_text') | trim | length > 0) and repeat.index < input_frigate_retry_attempts | int }}"
          then:
            - delay:
                seconds: "{{ retry_secs }}"
      until: "{{ (response is mapping and response.get('response_text') is string and response.get('response_text') | trim | length > 0) or repeat.index >= input_frigate_retry_attempts | int }}"

  - if: "{{ not (response is mapping and response.get('response_text') is string and response.get('response_text') | trim | length > 0) }}"
    then:
      - service: logbook.log
        data:
          name: Frigate Notification
          message: "AI analysis failed for {{ camera }} event {{ id }} after {{ input_frigate_retry_attempts }} attempts."
      - stop: No AI summary returned

  - variables:
      summary_title: "{{ (response.get('title') or response.get('response_title') or base_title) if input_generate_title else base_title }}"
  - if: "{{ input_log_helper | length > 0 }}"
    then:
      - service: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ input_log_helper }}"
        data:
          value: >-
            {% set limit = [255, state_attr(input_log_helper, 'max') | int(100)] | min %}
            {% set old = states(input_log_helper) %}
            {% set old = '' if old in ['unknown', 'unavailable'] else old %}
            {% set header = '[' ~ now().strftime('%Y-%m-%d %H:%M') ~ '] ' ~ camera_name ~ ': ' %}
            {% set entry = header ~ summary_title ~ '\n' ~ response.get('response_text', '') %}
            {{ (entry ~ '\n---\n' ~ old)[:limit] }}

  - *read_silence
  - condition: template
    value_template: *not_silenced
  - condition: template
    value_template: *cooldown_available
  - variables:
      notification_title: "{{ summary_title }}"
      notification_message: "{{ response.get('response_text', base_message) }}"
      notification_tag: "{{ id }}"
  - repeat: *send_notification
  - if: "{{ input_cooldown_datetime | length > 0 }}"
    then:
      - service: input_datetime.set_datetime
        target:
          entity_id: "{{ input_cooldown_datetime }}"
        data:
          timestamp: "{{ as_timestamp(now()) | int }}"

mode: parallel
max: 25
